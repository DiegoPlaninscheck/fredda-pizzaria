# Configuração do Prometheus (serviço "prometheus" do docker-compose, perfil "observabilidade").
# Todos os alvos estão na rede interna do compose; nenhum é exposto na internet.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/fredda/alertas.yml

scrape_configs:
  # App Next.js: métricas do Node e de negócio (lib/metricas.ts), rota protegida por token
  - job_name: app
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /prometheus/.metrics_token
    static_configs:
      - targets: ["app:3000"]

  # Microsserviço de previsão de demanda (FastAPI)
  - job_name: ia
    metrics_path: /metrics
    static_configs:
      - targets: ["ia:8000"]

  # VPS: CPU, memória, disco e rede
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
