# SonarCloud — análise estática de qualidade e segurança (job "sonar" do CI/CD).
# A organização e a chave devem ser as mesmas mostradas no SonarCloud ao importar o repositório.
sonar.organization=diegoplaninscheck
sonar.projectKey=DiegoPlaninscheck_fredda-pizzaria
sonar.projectName=Fredda Pizzaria

sonar.sources=app,components,lib,middleware.ts,types,prisma/seed.ts,ia/previsao,ia/servico
sonar.tests=tests,ia/tests
sonar.exclusions=prisma/migrations/**,public/**,**/*.css
sonar.sourceEncoding=UTF-8

# Python (microsserviço de previsão)
sonar.python.version=3.12
sonar.python.coverage.reportPaths=ia/coverage.xml

# TypeScript: cobertura dos testes do app (Vitest), gerada pelo job "web"
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# O resultado do quality gate aparece no SonarCloud, no badge do README e nos PRs.
# A meta de cobertura do Portfólio é garantida pelo próprio Vitest no job "web"
# (o job falha abaixo de 75% no backend / 25% no frontend); o Sonar não bloqueia o deploy.
sonar.qualitygate.wait=false
