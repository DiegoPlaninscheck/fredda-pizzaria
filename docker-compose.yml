>>>>>>> Stashed changes
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # Previsão de demanda (Python/FastAPI). Só é acessível pela rede interna do compose;
  # o app chama em http://ia:8000 com o cabeçalho X-API-Key.
  ia:
    build:
      context: ./ia
      dockerfile: Dockerfile
    container_name: fredda_ia
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-fredda}:${MYSQL_PASSWORD:-fredda123}@db:3306/${MYSQL_DATABASE:-fredda_pizzaria}
      IA_API_KEY: ${IA_API_KEY:-}
    volumes:
      - ia_modelos:/app/modelos
    depends_on:
      db:
        condition: service_healthy

  # Proxy reverso com HTTPS automático (Let's Encrypt) — exigido pelo webhook do WhatsApp.
  # Só sobe com: docker compose --profile https up -d  (requer DOMINIO no .env apontando para a VPS)
  caddy:
    image: caddy:2-alpine
    container_name: fredda_caddy
    restart: unless-stopped
    profiles: ["https"]
    environment:
      DOMINIO: ${DOMINIO:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  mysql_data:
  ia_modelos:
  caddy_data:
  caddy_config:
