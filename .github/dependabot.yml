# Atualizações automáticas de dependências (abre PRs semanais, que passam pelo CI).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dependencias-menores:
        update-types: [minor, patch]
    ignore:
      # Os tipos do Node acompanham a linha LTS do .nvmrc (troca manual, junto com o Dockerfile)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /ia
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dependencias-menores:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/, /ia]
    schedule:
      interval: weekly
    ignore:
      # Node fica numa linha LTS escolhida (.nvmrc = Dockerfile = CI); a troca de major é manual
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
